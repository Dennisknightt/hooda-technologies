<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Hooda Portal — Staff &amp; Admin</title>
<style>
  :root{
    --bg:#f4f5f7;--panel:#ffffff;--sidebar:#0d0f14;--ink:#1d1d1f;--ink-2:#6e6e73;--ink-3:#8a8a90;
    --line:rgba(0,0,0,.09);--line-d:rgba(255,255,255,.08);
    --accent:#0071e3;--accent-press:#0060c0;
    --green:#00a862;--amber:#e08600;--red:#e0245e;--violet:#6c5ce7;--pink:#ff7ac1;--cyan:#00b8d4;
    --c1:#0071e3;--c2:#6c5ce7;--c3:#00a862;--c4:#e08600;--c5:#ff6b6b;--c6:#ff7ac1;
    --radius:16px;--radius-sm:11px;
    --shadow-xs:0 1px 3px rgba(0,0,0,.05);--shadow-sm:0 8px 24px -12px rgba(0,0,0,.18);
    --shadow:0 24px 60px -30px rgba(0,0,0,.4);
    --font:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:.92rem}
  a{color:inherit}
  .icon{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
  ::selection{background:rgba(0,113,227,.16)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  .hidden{display:none!important}
  .muted{color:var(--ink-3)}

  /* ---------- LOGIN ---------- */
  #login{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:radial-gradient(120% 90% at 50% -10%,#20202b,#0c0c11 50%,#050507)}
  .login-card{width:min(410px,94vw);background:var(--panel);border-radius:24px;box-shadow:var(--shadow);padding:36px 32px}
  .login-logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.1rem}
  .login-logo .mark{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#2b2b30,#0a0a0c)}
  .login-logo .mark .icon{width:17px;height:17px}
  .login-card h1{font-size:1.4rem;font-weight:600;margin:16px 0 4px}
  .login-card p.sub{color:var(--ink-2);font-size:.9rem;margin-bottom:20px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:.78rem;font-weight:600;color:var(--ink-2);margin-bottom:6px}
  .field input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:var(--bg)}
  .field input:focus{border-color:var(--accent);outline:none;background:#fff}
  .login-btn{width:100%;margin-top:6px;padding:12px;border-radius:11px;background:var(--accent);color:#fff;font-weight:600;font-size:1rem;transition:background .2s}
  .login-btn:hover{background:var(--accent-press)}
  .login-err{color:var(--red);font-size:.84rem;margin-top:10px;min-height:1.1em;text-align:center}
  .demo{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:.8rem;color:var(--ink-2)}
  .demo .row{display:flex;justify-content:space-between;gap:10px;margin-top:8px}
  .demo .row b{color:var(--ink)}
  .demo button{color:var(--accent);font-weight:600}

  /* ---------- APP LAYOUT ---------- */
  #app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
  .sidebar{background:var(--sidebar);color:#c9c9d2;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .sb-logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem;color:#fff;padding:18px 20px 14px}
  .sb-logo .mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(145deg,#3a3a44,#111);}
  .sb-logo .mark .icon{width:16px;height:16px;stroke:#fff}
  .sb-nav{flex:1;overflow-y:auto;padding:8px 12px}
  .sb-group{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:#5f5f6b;margin:16px 12px 6px}
  .sb-item{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:10px;color:#b4b4c0;font-size:.9rem;font-weight:500;transition:background .15s,color .15s;text-align:left}
  .sb-item .icon{width:18px;height:18px}
  .sb-item:hover{background:rgba(255,255,255,.06);color:#fff}
  .sb-item.active{background:var(--accent);color:#fff}
  .sb-user{border-top:1px solid var(--line-d);padding:14px;display:flex;align-items:center;gap:11px}
  .sb-user .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.82rem;color:#fff;flex:none}
  .sb-user .nm{font-size:.86rem;font-weight:600;color:#fff;line-height:1.1}
  .sb-user .rl{font-size:.72rem;color:#8a8a96}
  .sb-user .out{margin-left:auto;color:#8a8a96;padding:6px;border-radius:8px}
  .sb-user .out:hover{background:rgba(255,255,255,.08);color:#fff}
  .sb-user .out .icon{width:18px;height:18px}

  .content{min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:15;background:rgba(244,245,247,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:14px 26px}
  .topbar h1{font-size:1.3rem;font-weight:600}
  .topbar .sub{font-size:.85rem;color:var(--ink-2)}
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:14px}
  .live-dot{display:flex;align-items:center;gap:7px;font-size:.8rem;color:var(--ink-2);font-weight:500}
  .live-dot i{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,168,98,.5)}70%{box-shadow:0 0 0 7px rgba(0,168,98,0)}100%{box-shadow:0 0 0 0 rgba(0,168,98,0)}}
  .hamburger{display:none;width:40px;height:40px;border-radius:10px;place-items:center;background:var(--panel);box-shadow:var(--shadow-xs)}
  .hamburger .icon{width:22px;height:22px;stroke:var(--ink)}
  main{padding:24px 26px 60px;max-width:1200px;width:100%}

  /* ---------- COMPONENTS ---------- */
  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:11px;font-weight:600;font-size:.86rem;transition:background .2s,transform .2s,box-shadow .2s}
  .btn .icon{width:16px;height:16px}
  .btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-press);transform:translateY(-1px)}
  .btn-soft{background:var(--panel);color:var(--ink);border:1px solid var(--line)}.btn-soft:hover{background:#eceef1}
  .btn-danger{background:rgba(224,36,94,.1);color:var(--red)}.btn-danger:hover{background:rgba(224,36,94,.18)}
  .btn-sm{padding:7px 11px;font-size:.8rem}
  .btn-block{width:100%;justify-content:center;padding:12px}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
  .kpi .k-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;margin-bottom:12px}
  .kpi .k-ic .icon{width:19px;height:19px}
  .kpi .val{font-size:1.55rem;font-weight:700;letter-spacing:-.02em}
  .kpi .lbl{font-size:.82rem;color:var(--ink-2);margin-top:2px}
  .kpi .delta{font-size:.74rem;font-weight:600;margin-top:5px}
  .kpi .delta.up{color:var(--green)}.kpi .delta.down{color:var(--red)}

  .cols{display:grid;gap:18px}
  .cols.two{grid-template-columns:1.5fr 1fr}
  .cols.even{grid-template-columns:1fr 1fr}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line)}
  .panel-head h3{font-size:1.02rem;font-weight:600}
  .panel-head .hint{font-size:.78rem;color:var(--ink-3)}
  .panel-body{padding:16px 18px}
  .section-title{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:26px 0 12px}

  /* charts */
  .chartbox{width:100%}
  .chartbox svg{width:100%;height:auto;display:block}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
  .legend span{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--ink-2)}
  .legend span i{width:10px;height:10px;border-radius:3px}
  .donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}

  .hbars{display:flex;flex-direction:column;gap:11px}
  .hbar{display:grid;grid-template-columns:130px 1fr auto;align-items:center;gap:12px}
  .hb-label{font-size:.86rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hb-track{height:9px;background:var(--bg);border-radius:6px;overflow:hidden}
  .hb-fill{height:100%;border-radius:6px;transition:width .5s}
  .hb-val{font-size:.82rem;font-weight:600;color:var(--ink-2);white-space:nowrap}

  /* tables */
  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:0 14px 11px}
  td{padding:11px 14px;border-top:1px solid var(--line);font-size:.9rem;vertical-align:middle}
  tbody tr:hover{background:rgba(0,0,0,.015)}
  .prod-cell{display:flex;align-items:center;gap:11px;font-weight:600}
  .prod-dot{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:.66rem;font-weight:700;flex:none}
  .inp{width:118px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff}
  .inp.sm{width:70px}
  .search{padding:9px 13px;border:1px solid var(--line);border-radius:11px;background:var(--panel);width:230px;max-width:46vw}
  .sel{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-weight:600;color:var(--ink-2)}

  .pill{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:980px;display:inline-block}
  .pill.ok{background:rgba(0,168,98,.14);color:var(--green)}
  .pill.low{background:rgba(224,134,0,.16);color:var(--amber)}
  .pill.out{background:rgba(224,36,94,.12);color:var(--red)}
  .pill.neutral{background:var(--bg);color:var(--ink-2)}
  .pill.hot{background:rgba(0,113,227,.12);color:var(--accent)}
  .pill.cold{background:rgba(138,138,144,.16);color:var(--ink-3)}
  .badge-src{font-size:.68rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:3px 9px;border-radius:980px}
  .src-Site{background:rgba(0,113,227,.12);color:var(--accent)}
  .src-WhatsApp{background:rgba(0,168,98,.14);color:var(--green)}
  .src-In-store{background:rgba(108,92,231,.14);color:var(--violet)}
  .role-badge{font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:980px;text-transform:capitalize}
  .role-admin{background:rgba(108,92,231,.14);color:var(--violet)}
  .role-manager{background:rgba(0,113,227,.12);color:var(--accent)}
  .role-sales{background:rgba(0,168,98,.14);color:var(--green)}

  /* feed */
  .feed{display:flex;flex-direction:column;gap:11px;max-height:520px;overflow-y:auto}
  .order-card{border:1px solid var(--line);border-radius:13px;padding:13px}
  .order-card.flash{animation:flashIn 1s ease}
  @keyframes flashIn{0%{background:rgba(0,113,227,.12)}100%{background:#fff}}
  .oc-top{display:flex;align-items:center;gap:9px;margin-bottom:7px}
  .oid{font-weight:700;font-size:.84rem}
  .otime{margin-left:auto;font-size:.76rem;color:var(--ink-3)}
  .oc-cust{font-size:.88rem;font-weight:500}
  .oc-items{font-size:.83rem;color:var(--ink-2);margin:2px 0 9px}
  .oc-bottom{display:flex;align-items:center;gap:9px}
  .ototal{font-weight:700}
  .opay{font-size:.76rem;color:var(--ink-2);background:var(--bg);border:1px solid var(--line);padding:3px 9px;border-radius:980px}
  .ostatus{margin-left:auto;padding:6px 9px;border:1px solid var(--line);border-radius:9px;background:#fff;font-weight:600;color:var(--ink-2);font-size:.82rem}
  .ostaff{font-size:.75rem;color:var(--ink-3);margin-top:5px}

  /* POS */
  .pos-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;align-items:start}
  .form-row{margin-bottom:13px}
  .form-row label{display:block;font-size:.79rem;font-weight:600;color:var(--ink-2);margin-bottom:6px}
  .form-row select,.form-row input,.form-row textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:#fff}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .draft{display:flex;flex-direction:column;gap:9px;min-height:56px}
  .draft-empty{color:var(--ink-3);font-size:.86rem;text-align:center;padding:16px 0}
  .draft-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border:1px solid var(--line);border-radius:11px}
  .draft-item .di-name{font-weight:600;font-size:.88rem;flex:1}
  .draft-item .di-qty{font-size:.8rem;color:var(--ink-2)}
  .draft-item .di-amt{font-weight:700;font-size:.88rem}
  .draft-item .di-rm{color:var(--ink-3)}.draft-item .di-rm:hover{color:var(--red)}
  .draft-item .di-rm .icon{width:15px;height:15px}
  .sale-total{display:flex;justify-content:space-between;align-items:center;margin:16px 0 12px;font-size:1.2rem;font-weight:700}

  /* modal */
  #modalOverlay{position:fixed;inset:0;z-index:70;background:rgba(10,10,14,.5);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
  #modalOverlay.open{opacity:1;visibility:visible}
  #modal{position:fixed;z-index:71;top:50%;left:50%;width:min(540px,94vw);max-height:90vh;overflow-y:auto;transform:translate(-50%,-46%) scale(.98);opacity:0;visibility:hidden;background:var(--panel);border-radius:22px;box-shadow:var(--shadow);transition:opacity .3s,transform .3s,visibility .3s}
  #modal.open{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 14px;border-bottom:1px solid var(--line)}
  .modal-head h3{font-size:1.2rem;font-weight:600}
  .modal-close{width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
  .modal-close:hover{background:var(--bg)}.modal-close .icon{width:19px;height:19px;stroke:var(--ink)}
  .modal-body{padding:20px 24px}
  .modal-foot{padding:14px 24px 22px;display:flex;gap:10px}
  .modal-foot .btn{flex:1;justify-content:center}
  .perm-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
  .perm{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;cursor:pointer;font-size:.86rem;font-weight:500}
  .perm input{width:16px;height:16px;accent-color:var(--accent)}
  .perm.on{border-color:var(--accent);background:rgba(0,113,227,.05)}

  #toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;z-index:80;background:rgba(18,18,22,.96);color:#fff;padding:13px 20px;border-radius:13px;box-shadow:var(--shadow);font-weight:500;display:flex;align-items:center;gap:10px;transition:transform .35s,opacity .35s}
  #toast.show{transform:translate(-50%,0);opacity:1}
  #toast .tk{width:24px;height:24px;border-radius:50%;background:var(--green);display:grid;place-items:center}
  #toast .tk.warn{background:var(--amber)}
  #toast .tk .icon{width:14px;height:14px;stroke:#fff;stroke-width:2.6}

  .empty{color:var(--ink-3);text-align:center;padding:26px 12px;font-size:.9rem}

  @media(max-width:1000px){ .cols.two,.cols.even{grid-template-columns:1fr} .kpis{grid-template-columns:1fr 1fr} .pos-grid{grid-template-columns:1fr} }
  @media(max-width:820px){
    #app{grid-template-columns:1fr}
    .sidebar{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:40;transform:translateX(-100%);transition:transform .3s;box-shadow:var(--shadow)}
    .sidebar.open{transform:none}
    .hamburger{display:grid}
    #sbScrim{position:fixed;inset:0;z-index:39;background:rgba(0,0,0,.4);opacity:0;visibility:hidden;transition:.3s}
    #sbScrim.open{opacity:1;visibility:visible}
    main{padding:18px 16px 50px}
    .topbar{padding:12px 16px}
  }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login">
  <div class="login-card">
    <div class="login-logo"><span class="mark"><svg class="icon" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M11 18h2"/></svg></span> HOODA<span style="color:var(--accent)">.</span></div>
    <h1>Staff &amp; Admin Portal</h1>
    <p class="sub">Sign in to manage orders, stock, staff and reports.</p>
    <form id="loginForm">
      <div class="field"><label for="u">Username</label><input id="u" autocomplete="username" autocapitalize="off" spellcheck="false" /></div>
      <div class="field"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" /></div>
      <button class="login-btn" type="submit">Sign in</button>
      <div class="login-err" id="loginErr"></div>
    </form>
    <div class="demo">
      <b style="color:var(--ink)">Demo accounts</b> — click Use to fill
      <div class="row"><span>Admin · <b>admin</b> / admin123</span><button data-u="admin" data-p="admin123" class="fill">Use</button></div>
      <div class="row"><span>Manager · <b>cynthia</b> / manager123</span><button data-u="cynthia" data-p="manager123" class="fill">Use</button></div>
      <div class="row"><span>Sales · <b>brian</b> / staff123</span><button data-u="brian" data-p="staff123" class="fill">Use</button></div>
    </div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="sb-logo"><span class="mark"><svg class="icon" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M11 18h2"/></svg></span> HOODA<span style="color:#7db2ff">.</span></div>
    <nav class="sb-nav" id="sbNav"></nav>
    <div class="sb-user">
      <span class="av" id="sbAv"></span>
      <div style="min-width:0"><div class="nm" id="sbNm"></div><div class="rl" id="sbRl"></div></div>
      <button class="out" id="logoutBtn" title="Log out"><svg class="icon" viewBox="0 0 24 24"><path d="M15 17l5-5-5-5M20 12H9M9 20H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h4"/></svg></button>
    </div>
  </aside>
  <div id="sbScrim"></div>
  <div class="content">
    <header class="topbar">
      <button class="hamburger" id="hamburger"><svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div><h1 id="pageTitle">Dashboard</h1><div class="sub" id="pageSub"></div></div>
      <div class="topbar-right"><span class="live-dot"><i></i> Live</span></div>
    </header>
    <main id="view"></main>
  </div>
</div>

<div id="modalOverlay"></div>
<div id="modal" role="dialog" aria-modal="true"></div>
<div id="toast"><span class="tk" id="toastTk"><svg class="icon" viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg></span><span id="toastMsg"></span></div>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };

  /* ============ PERMISSIONS ============ */
  var PERMS = [
    ["dashboard","Dashboard"],
    ["insights","Insights"],
    ["orders","Orders"],
    ["inventory","Inventory & pricing"],
    ["reports","Reports & export"],
    ["pos","Make sales (POS)"],
    ["staff","Manage staff"]
  ];
  var ROLE_PERMS = {
    admin:   PERMS.map(function(p){return p[0];}),
    manager: ["dashboard","insights","orders","inventory","reports","pos"],
    sales:   ["pos"]
  };

  /* ============ STORE ============ */
  var KEY = "hooda_portal_v2";
  var bc = null;
  try{ if("BroadcastChannel" in window) bc = new BroadcastChannel("hooda_portal2"); }catch(e){ bc = null; }

  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
  function weightedIndex(w){ var t=w.reduce(function(s,x){return s+x;},0), r=Math.random()*t; for(var i=0;i<w.length;i++){ r-=w[i]; if(r<=0) return i; } return w.length-1; }

  function seed(){
    var products = [
      {id:"ip16pm", name:"iPhone 16 Pro Max", brand:"iPhone",  price:210000, cost:178000, stock:5,  color:"#3b4574"},
      {id:"ip16p",  name:"iPhone 16 Pro",     brand:"iPhone",  price:175000, cost:148000, stock:8,  color:"#463a68"},

  function unitsByProduct(list){
    var map={}; state.products.forEach(function(p){ map[p.name]={p:p, u:0, rev:0}; });

  /* ============ CHARTS (SVG) ============ */
  var PAL=["#0071e3","#6c5ce7","#00a862","#e08600","#ff6b6b","#ff7ac1"];
  function barChart(series, color){
    var w=580,h=170,pad=26,n=series.length,max=Math.max.apply(null,series.map(function(s){return s.v;}))||1;
    var bw=(w-pad*2)/n;
    var bars=series.map(function(s,i){
      var bh=(h-pad*1.7)*(s.v/max), x=pad+i*bw+bw*0.18, y=h-pad-bh;
      return '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw*0.64).toFixed(1)+'" height="'+Math.max(1,bh).toFixed(1)+'" rx="3" fill="'+color+'"><title>'+s.full+': '+fmt(s.v)+'</title></rect>';
    }).join("");
    var labels=series.map(function(s,i){ if(n>16 && i%2) return ""; var x=pad+i*bw+bw*0.5; return '<text x="'+x.toFixed(1)+'" y="'+(h-8)+'" text-anchor="middle" font-size="9" fill="#8a8a90">'+s.label+'</text>'; }).join("");
    return '<div class="chartbox"><svg viewBox="0 0 '+w+' '+h+'"><line x1="'+pad+'" y1="'+(h-pad)+'" x2="'+(w-pad)+'" y2="'+(h-pad)+'" stroke="#e5e5ea"/>'+bars+labels+'</svg></div>';
  }
  function donut(segs){
    var total=sum(segs,function(s){return s.v;})||1, r=52, c=2*Math.PI*r, off=0;

    return '<svg viewBox="0 0 140 140" width="132" height="132">'+circ+'<text x="70" y="66" text-anchor="middle" font-size="22" font-weight="700" fill="#1d1d1f">'+total+'</text><text x="70" y="84" text-anchor="middle" font-size="9" fill="#8a8a90">TOTAL</text></svg>';
  }

  function exportCSV(list){
    var head=["Order","DateTime","Source","Customer","Phone","Items","Total_KES","Payment","Staff","Status"];
    var rows=[head].concat(list.map(function(o){ return [o.id, new Date(o.ts).toISOString(), o.source, o.customer, o.phone, o.items.map(function(i){return i.name+" x"+i.qty;}).join("; "), o.total, o.payment, o.staff, o.status]; }));
    var csv=rows.map(function(r){ return r.map(function(c){ return '"'+String(c).replace(/"/g,'""')+'"'; }).join(","); }).join("\n");
    try{
      var blob=new Blob([csv],{type:"text/csv"}), url=URL.createObjectURL(blob), a=document.createElement("a");
      a.href=url; a.download="hooda-orders-"+repRange+".csv"; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); },800);

    if(have+qty>p.stock){ toast("Only "+p.stock+" in stock for "+p.name, true); return; }

      '<div class="kpis" style="grid-template-columns:repeat(2,1fr);max-width:520px">'
      + kpiCard("rgba(0,168,98,.14)","var(--green)",'<path d="M3 3v18h18"/><path d="M7 14l3-3 3 3 5-6"/>', fmt(revenue(mine)), "Total sold by me")
      + kpiCard("rgba(0,113,227,.12)","var(--accent)",'<rect x="4" y="4" width="16" height="16" rx="2"/>', mine.length, "Sales made")
      + '</div>'
      + '<div class="panel"><div class="table-wrap"><table><thead><tr><th>Order</th><th>Items</th><th>Total</th><th>Source</th><th>Status</th></tr></thead><tbody>'
      + (mine.length? mine.map(function(o){return '<tr><td><b>'+o.id+'</b><div class="muted" style="font-size:.75rem">'+dateStr(o.ts)+' · '+timeStr(o.ts)+'</div></td><td class="muted">'+itemsLabel(o)+'</td><td><b>'+fmt(o.total)+'</b></td><td><span class="badge-src src-'+o.source.replace(/\s/g,"-")+'">'+o.source+'</span></td><td>'+o.status+'</td></tr>';}).join("") : '<tr><td colspan="5" class="empty">No sales yet — record one from “New Sale”.</td></tr>')
      + '</tbody></table></div></div>';
  }

  /* ============ MODAL ============ */
  var modalSave=null;
  function openModal(title, bodyHTML, saveLabel, onSave){
    modalSave=onSave;
    $("modal").innerHTML =
      '<div class="modal-head"><h3>'+title+'</h3><button class="modal-close" id="modalClose"><svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>'
      + '<div class="modal-body">'+bodyHTML+'</div>'
      + '<div class="modal-foot"><button class="btn btn-soft" id="modalCancel">Cancel</button><button class="btn btn-primary" id="modalOk">'+saveLabel+'</button></div>';
    $("modalOverlay").classList.add("open"); $("modal").classList.add("open");
    $("modalClose").addEventListener("click", closeModal);
    $("modalCancel").addEventListener("click", closeModal);
    $("modalOk").addEventListener("click", function(){ if(!modalSave || modalSave()!==false) closeModal(); });
  }
  function closeModal(){ $("modalOverlay").classList.remove("open"); $("modal").classList.remove("open"); }
  $("modalOverlay").addEventListener("click", closeModal);
  document.addEventListener("keydown", function(e){ if(e.key==="Escape" && $("modal").classList.contains("open")) closeModal(); });

  /* ============ TOAST ============ */
  var toastTimer=null;
  function toast(msg, warn){
    $("toastMsg").textContent=msg; $("toastTk").className="tk"+(warn?" warn":"");
    $("toast").classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(function(){ $("toast").classList.remove("show"); }, 2600);
  }

  /* ============ BOOT ============ */
  if(me()) enterApp();
})();
</script>
</body>
</html>
