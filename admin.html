<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Hooda Portal — Staff &amp; Admin</title>
<style>
  :root{
    --bg:#f5f5f7;--panel:#ffffff;--ink:#1d1d1f;--ink-2:#6e6e73;--ink-3:#8a8a90;
    --line:rgba(0,0,0,.10);--black:#06060a;--accent:#0071e3;--accent-press:#0060c0;
    --green:#00a862;--amber:#c98a00;--red:#e0245e;--violet:#6c5ce7;
    --radius:18px;--radius-sm:12px;--shadow-xs:0 1px 3px rgba(0,0,0,.05);
    --shadow-sm:0 6px 20px -10px rgba(0,0,0,.18);--shadow:0 24px 60px -30px rgba(0,0,0,.35);
    --font:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit;font-size:.95rem}
  a{color:inherit}
  .icon{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
  ::selection{background:rgba(0,113,227,.16)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

  /* ---------- LOGIN ---------- */
  #login{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;
    background:radial-gradient(120% 90% at 50% -10%,#20202b,#0c0c11 50%,#050507)}
  .login-card{width:min(410px,94vw);background:var(--panel);border-radius:26px;box-shadow:var(--shadow);padding:38px 34px}
  .login-logo{display:flex;align-items:center;gap:11px;font-weight:700;font-size:1.15rem;margin-bottom:6px}
  .login-logo .mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#2b2b30,#0a0a0c)}
  .login-logo .mark .icon{width:18px;height:18px}
  .login-card h1{font-size:1.5rem;font-weight:600;margin:16px 0 4px}
  .login-card p.sub{color:var(--ink-2);font-size:.92rem;margin-bottom:22px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:.8rem;font-weight:600;color:var(--ink-2);margin-bottom:6px}
  .field input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);transition:border-color .2s}
  .field input:focus{border-color:var(--accent);outline:none;background:#fff}
  .login-btn{width:100%;margin-top:6px;padding:13px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;font-size:1rem;transition:background .2s,transform .2s}
  .login-btn:hover{background:var(--accent-press);transform:translateY(-1px)}
  .login-err{color:var(--red);font-size:.85rem;margin-top:12px;min-height:1.1em;text-align:center}
  .demo{margin-top:20px;padding-top:18px;border-top:1px solid var(--line);font-size:.82rem;color:var(--ink-2)}
  .demo b{color:var(--ink)}
  .demo .row{display:flex;justify-content:space-between;gap:10px;margin-top:8px}
  .demo button{color:var(--accent);font-weight:600;font-size:.82rem}

  /* ---------- SHELL ---------- */
  .hidden{display:none!important}
  header.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .top-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:12px 20px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700}
  .brand .mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#2b2b30,#0a0a0c)}
  .brand .mark .icon{width:16px;height:16px}
  .portal-label{font-size:.72rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);border-left:1px solid var(--line);padding-left:14px;margin-left:4px}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:14px}
  .live-dot{display:flex;align-items:center;gap:7px;font-size:.8rem;color:var(--ink-2);font-weight:500}
  .live-dot i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(0,168,98,.5);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,168,98,.5)}70%{box-shadow:0 0 0 7px rgba(0,168,98,0)}100%{box-shadow:0 0 0 0 rgba(0,168,98,0)}}
  .user-chip{display:flex;align-items:center;gap:9px;font-size:.86rem}
  .user-chip .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.82rem;color:#fff}
  .user-chip .nm{font-weight:600;line-height:1.1}
  .user-chip .rl{font-size:.72rem;color:var(--ink-3)}
  .logout{padding:8px 13px;border-radius:10px;border:1px solid var(--line);font-size:.84rem;font-weight:600;color:var(--ink-2);transition:background .2s}
  .logout:hover{background:var(--bg)}

  nav.tabs{max-width:1180px;margin:0 auto;padding:0 20px;display:flex;gap:4px}
  .tab{padding:14px 16px;font-size:.92rem;font-weight:500;color:var(--ink-2);border-bottom:2px solid transparent;transition:color .2s,border-color .2s;display:flex;align-items:center;gap:7px}
  .tab .icon{width:17px;height:17px}
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--accent);border-color:var(--accent)}
  main{max-width:1180px;margin:0 auto;padding:26px 20px 60px}
  .view-head{margin-bottom:22px}
  .view-head h2{font-size:1.5rem;font-weight:600}
  .view-head p{color:var(--ink-2);font-size:.92rem;margin-top:3px}

  /* ---------- CARDS / KPI ---------- */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
  .kpi .k-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;margin-bottom:14px}
  .kpi .k-ic .icon{width:20px;height:20px}
  .kpi .val{font-size:1.7rem;font-weight:700;letter-spacing:-.02em}
  .kpi .lbl{font-size:.84rem;color:var(--ink-2);margin-top:2px}
  .grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .panel-head h3{font-size:1.05rem;font-weight:600}
  .panel-body{padding:16px 18px}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:11px;font-weight:600;font-size:.86rem;transition:background .2s,transform .2s,box-shadow .2s}
  .btn .icon{width:16px;height:16px}
  .btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-press);transform:translateY(-1px)}
  .btn-soft{background:var(--bg);color:var(--ink);border:1px solid var(--line)}.btn-soft:hover{background:#ececee}
  .btn-block{width:100%;justify-content:center;padding:13px}

  /* ---------- ORDERS FEED ---------- */
  .feed{display:flex;flex-direction:column;gap:12px;max-height:560px;overflow-y:auto}
  .order-card{border:1px solid var(--line);border-radius:14px;padding:14px}
  .order-card.flash{animation:flashIn .9s var(--ease,ease)}
  @keyframes flashIn{0%{background:rgba(0,113,227,.12);transform:translateY(-4px)}100%{background:#fff;transform:none}}
  .oc-top{display:flex;align-items:center;gap:9px;margin-bottom:8px}
  .badge-src{font-size:.68rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:3px 9px;border-radius:980px}
  .src-Site{background:rgba(0,113,227,.12);color:var(--accent)}
  .src-WhatsApp{background:rgba(0,168,98,.14);color:var(--green)}
  .src-In-store{background:rgba(108,92,231,.14);color:var(--violet)}
  .oid{font-weight:700;font-size:.86rem}
  .otime{margin-left:auto;font-size:.78rem;color:var(--ink-3)}
  .oc-cust{font-size:.9rem;font-weight:500}
  .oc-items{font-size:.85rem;color:var(--ink-2);margin:3px 0 10px}
  .oc-bottom{display:flex;align-items:center;gap:10px}
  .ototal{font-weight:700}
  .opay{font-size:.78rem;color:var(--ink-2);background:var(--bg);border:1px solid var(--line);padding:3px 9px;border-radius:980px}
  .ostatus{margin-left:auto;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:600;color:var(--ink-2)}
  .ostaff{font-size:.76rem;color:var(--ink-3);margin-top:6px}

  /* ---------- TABLE ---------- */
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:0 12px 12px}
  td{padding:12px;border-top:1px solid var(--line);font-size:.9rem;vertical-align:middle}
  .prod-cell{display:flex;align-items:center;gap:11px;font-weight:600}
  .prod-dot{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:.7rem;font-weight:700}
  .inp{width:120px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff}
  .inp.sm{width:74px}
  .pill{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:980px}
  .pill.ok{background:rgba(0,168,98,.14);color:var(--green)}
  .pill.low{background:rgba(201,138,0,.16);color:var(--amber)}
  .pill.out{background:rgba(224,36,94,.12);color:var(--red)}
  .row-saved{animation:savedRow 1s ease}
  @keyframes savedRow{0%{background:rgba(0,168,98,.1)}100%{background:transparent}}

  /* ---------- POS ---------- */
  .pos-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:start}
  .form-row{margin-bottom:14px}
  .form-row label{display:block;font-size:.8rem;font-weight:600;color:var(--ink-2);margin-bottom:6px}
  .form-row select,.form-row input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:#fff}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .draft{display:flex;flex-direction:column;gap:10px;min-height:60px}
  .draft-empty{color:var(--ink-3);font-size:.88rem;text-align:center;padding:18px 0}
  .draft-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
  .draft-item .di-name{font-weight:600;font-size:.9rem;flex:1}
  .draft-item .di-qty{font-size:.82rem;color:var(--ink-2)}
  .draft-item .di-amt{font-weight:700;font-size:.9rem}
  .draft-item .di-rm{color:var(--ink-3)}.draft-item .di-rm:hover{color:var(--red)}
  .draft-item .di-rm .icon{width:16px;height:16px}
  .sale-total{display:flex;justify-content:space-between;align-items:center;margin:18px 0 14px;font-size:1.25rem;font-weight:700}
  .my-sales{margin-top:26px}

  #toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;z-index:60;background:rgba(18,18,22,.96);color:#fff;padding:13px 20px;border-radius:14px;box-shadow:var(--shadow);font-weight:500;display:flex;align-items:center;gap:10px;transition:transform .35s,opacity .35s}
  #toast.show{transform:translate(-50%,0);opacity:1}
  #toast .tk{width:24px;height:24px;border-radius:50%;background:var(--green);display:grid;place-items:center}
  #toast .tk .icon{width:14px;height:14px;stroke:#fff;stroke-width:2.6}

  @media(max-width:820px){
    .kpis{grid-template-columns:1fr 1fr}
    .grid-2,.pos-grid{grid-template-columns:1fr}
    .table-wrap{overflow-x:auto}
    table{min-width:560px}
  }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login">
  <div class="login-card">
    <div class="login-logo"><span class="mark"><svg class="icon" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M11 18h2"/></svg></span> HOODA<span style="color:var(--accent)">.</span></div>
    <h1>Staff &amp; Admin Portal</h1>
    <p class="sub">Sign in to manage orders, stock and sales.</p>
    <form id="loginForm">
      <div class="field"><label for="u">Username</label><input id="u" autocomplete="username" autocapitalize="off" spellcheck="false" /></div>
      <div class="field"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" /></div>
      <button class="login-btn" type="submit">Sign in</button>
      <div class="login-err" id="loginErr"></div>
    </form>
    <div class="demo">
      <b>Demo accounts</b> — click to fill
      <div class="row"><span>Admin · <b>admin</b> / admin123</span><button data-u="admin" data-p="admin123" class="fill">Use</button></div>
      <div class="row"><span>Staff · <b>brian</b> / staff123</span><button data-u="brian" data-p="staff123" class="fill">Use</button></div>
    </div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app" class="hidden">
  <header class="top">
    <div class="top-inner">
      <div class="brand"><span class="mark"><svg class="icon" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M11 18h2"/></svg></span> HOODA<span style="color:var(--accent)">.</span>
        <span class="portal-label" id="portalLabel">Portal</span>
      </div>
      <div class="top-right">
        <span class="live-dot"><i></i> Live</span>
        <div class="user-chip"><span class="av" id="userAv"></span><div><div class="nm" id="userNm"></div><div class="rl" id="userRl"></div></div></div>
        <button class="logout" id="logoutBtn">Log out</button>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="view"></main>
</div>

<div id="toast"><span class="tk"><svg class="icon" viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg></span><span id="toastMsg"></span></div>

<script>
(function(){
  "use strict";

  /* ============ DATA STORE (local prototype) ============ */
  var KEY = "hooda_portal_v1";
  var bc = ("BroadcastChannel" in window) ? new BroadcastChannel("hooda_portal") : null;

  function seed(){
    var now = Date.now(), mins = function(m){ return now - m*60000; };
    return {
      seq: 1044,
      products: [
        {id:"ip16pm", name:"iPhone 16 Pro Max", brand:"iPhone",  price:210000, stock:5,  color:"#3b4574"},
        {id:"ip16p",  name:"iPhone 16 Pro",     brand:"iPhone",  price:175000, stock:8,  color:"#463a68"},
        {id:"ip16",   name:"iPhone 16",         brand:"iPhone",  price:128000, stock:12, color:"#1f6a72"},
        {id:"ip15",   name:"iPhone 15",         brand:"iPhone",  price:99000,  stock:4,  color:"#7a5a44"},
        {id:"s25u",   name:"Galaxy S25 Ultra",  brand:"Samsung", price:205000, stock:6,  color:"#155a5f"},
        {id:"zf6",    name:"Galaxy Z Fold6",    brand:"Samsung", price:265000, stock:3,  color:"#373d66"},
        {id:"s25p",   name:"Galaxy S25+",       brand:"Samsung", price:158000, stock:9,  color:"#204f88"},
        {id:"zflip6", name:"Galaxy Z Flip6",    brand:"Samsung", price:142000, stock:2,  color:"#772050"}
      ],
      orders: [
        {id:"HD-1043", ts:mins(9),  items:[{name:"iPhone 15",qty:1,price:99000}], total:99000, customer:"Mueni P.", phone:"0721 004 552", payment:"Cash", source:"In-store", staff:"Brian (Sales)", status:"Delivered"},
        {id:"HD-1042", ts:mins(24), items:[{name:"Galaxy S25 Ultra",qty:1,price:205000}], total:205000, customer:"Wanjiru M.", phone:"0712 887 340", payment:"M-Pesa", source:"WhatsApp", staff:"—", status:"Packing"},
        {id:"HD-1041", ts:mins(52), items:[{name:"iPhone 16",qty:1,price:128000}], total:128000, customer:"Otieno K.", phone:"0733 210 118", payment:"M-Pesa", source:"Site", staff:"—", status:"Delivered"}
      ]
    };
  }
  function load(){
    try{ var s = localStorage.getItem(KEY); if(s) return JSON.parse(s); }catch(e){}
    var st = seed(); persist(st); return st;
  }
  function persist(st){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
  function commit(){ persist(state); if(bc) bc.postMessage({t:Date.now()}); }

  var state = load();
  if(bc) bc.onmessage = function(){ state = load(); rerender(true); };
  window.addEventListener("storage", function(e){ if(e.key===KEY){ state = load(); rerender(true); } });

  /* ============ AUTH (demo only) ============ */
  var USERS = [
    {u:"admin", p:"admin123", name:"Amina Hooda", role:"admin"},
    {u:"brian", p:"staff123", name:"Brian (Sales)", role:"staff"}
  ];
  var SKEY = "hooda_session";
  function session(){ try{ return JSON.parse(sessionStorage.getItem(SKEY)); }catch(e){ return null; } }
  function setSession(s){ try{ if(s) sessionStorage.setItem(SKEY, JSON.stringify(s)); else sessionStorage.removeItem(SKEY); }catch(e){} }
  var me = session();

  var loginEl = document.getElementById("login"), appEl = document.getElementById("app");
  document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();
    var u = document.getElementById("u").value.trim().toLowerCase(), p = document.getElementById("p").value;
    var hit = USERS.filter(function(x){ return x.u===u && x.p===p; })[0];
    if(!hit){ document.getElementById("loginErr").textContent = "Incorrect username or password."; return; }
    me = {name:hit.name, role:hit.role}; setSession(me); enterApp();
  });
  document.querySelectorAll(".fill").forEach(function(b){
    b.addEventListener("click", function(){ document.getElementById("u").value=b.dataset.u; document.getElementById("p").value=b.dataset.p; });
  });
  document.getElementById("logoutBtn").addEventListener("click", function(){ setSession(null); me=null; appEl.classList.add("hidden"); loginEl.classList.remove("hidden"); });

  /* ============ SHELL ============ */
  var view = "";
  var TABS = {
    admin: [["dashboard","Dashboard",'<path d="M4 13h7V4H4zM13 20h7V9h-7zM4 20h7v-4H4zM13 6h7V4h-7z"/>'],
            ["inventory","Inventory",'<path d="M4 7l8-4 8 4-8 4-8-4zM4 7v10l8 4 8-4V7M12 11v10"/>'],
            ["orders","Orders",'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/>']],
    staff: [["sale","New Sale",'<circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M3 4h2l2.4 12.2a1.5 1.5 0 0 0 1.5 1.2h8.1a1.5 1.5 0 0 0 1.5-1.2L21 8H6"/>'],
            ["mysales","My Sales",'<path d="M4 19V5M4 19h16M8 16v-5M12 16V8M16 16v-8"/>']]
  };
  function initials(n){ return n.split(/\s+/).map(function(w){return w[0];}).join("").slice(0,2).toUpperCase(); }
  function avColor(role){ return role==="admin" ? "linear-gradient(145deg,#6c5ce7,#0071e3)" : "linear-gradient(145deg,#00a862,#0071e3)"; }
  function enterApp(){
    loginEl.classList.add("hidden"); appEl.classList.remove("hidden");
    document.getElementById("portalLabel").textContent = me.role==="admin" ? "Admin Portal" : "Staff Portal";
    document.getElementById("userNm").textContent = me.name;
    document.getElementById("userRl").textContent = me.role==="admin" ? "Administrator" : "Sales staff";
    var av = document.getElementById("userAv"); av.textContent = initials(me.name); av.style.background = avColor(me.role);
    var tabs = TABS[me.role];
    document.getElementById("tabs").innerHTML = tabs.map(function(t){
      return '<button class="tab" data-view="'+t[0]+'"><svg class="icon" viewBox="0 0 24 24">'+t[2]+'</svg>'+t[1]+'</button>';
    }).join("");
    document.querySelectorAll(".tab").forEach(function(b){ b.addEventListener("click", function(){ go(b.dataset.view); }); });
    go(tabs[0][0]);
  }
  function go(v){
    view = v;
    document.querySelectorAll(".tab").forEach(function(b){ b.classList.toggle("active", b.dataset.view===v); });
    rerender(false);
  }

  /* ============ HELPERS ============ */
  function fmt(n){ return "KES " + Number(n).toLocaleString("en-KE"); }
  function timeStr(ts){ var d=new Date(ts); var h=d.getHours(), m=String(d.getMinutes()).padStart(2,"0"); var ap=h>=12?"PM":"AM"; h=h%12||12; return h+":"+m+" "+ap; }
  function isToday(ts){ var d=new Date(ts), n=new Date(); return d.toDateString()===n.toDateString(); }
  function itemsLabel(o){ return o.items.map(function(i){ return i.name+" ×"+i.qty; }).join(", "); }
  function stockPill(s){ if(s<=0) return '<span class="pill out">Out</span>'; if(s<=3) return '<span class="pill low">Low · '+s+'</span>'; return '<span class="pill ok">In stock · '+s+'</span>'; }
  function prodDot(p){ return '<span class="prod-dot" style="background:'+p.color+'">'+(p.brand==="iPhone"?"iP":"Ga")+'</span>'; }

  var lastOrderId = state.orders[0] ? state.orders[0].id : null;

  /* ============ RENDER ============ */
  function rerender(external){
    if(!me) return;
    if(view==="dashboard") renderDashboard(external);
    else if(view==="inventory") renderInventory();
    else if(view==="orders") renderOrders();
    else if(view==="sale") renderSale();
    else if(view==="mysales") renderMySales();
  }

  function kpis(){
    var today = state.orders.filter(function(o){ return isToday(o.ts); });
    var rev = today.reduce(function(s,o){ return s+o.total; },0);
    var units = today.reduce(function(s,o){ return s + o.items.reduce(function(a,i){return a+i.qty;},0); },0);
    var low = state.products.filter(function(p){ return p.stock<=3; }).length;
    return {rev:rev, orders:today.length, units:units, low:low};
  }

  function renderDashboard(external){
    var k = kpis();
    var newest = state.orders[0];
    document.getElementById("view").innerHTML =
      '<div class="view-head"><h2>Dashboard</h2><p>Live view of orders across the site, WhatsApp and in-store.</p></div>'
      + '<div class="kpis">'
      +   kpiCard("rgba(0,113,227,.12)","var(--accent)",'<path d="M3 3v18h18"/><path d="M7 14l3-3 3 3 5-6"/>', fmt(k.rev), "Revenue today")
      +   kpiCard("rgba(108,92,231,.14)","var(--violet)",'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h5"/>', k.orders, "Orders today")
      +   kpiCard("rgba(0,168,98,.14)","var(--green)",'<path d="M4 7l8-4 8 4-8 4-8-4zM4 7v10l8 4 8-4V7"/>', k.units, "Units sold today")
      +   kpiCard("rgba(201,138,0,.16)","var(--amber)",'<path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/>', k.low, "Low-stock items")
      + '</div>'
      + '<div class="grid-2">'
      +   '<div class="panel"><div class="panel-head"><h3>Live orders</h3><button class="btn btn-soft" id="simBtn"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Simulate incoming order</button></div>'
      +     '<div class="panel-body"><div class="feed" id="feed">'
      +       state.orders.map(function(o){ return orderCard(o, external && o.id!==lastOrderId && state.orders.indexOf(o)===0); }).join("")
      +     '</div></div></div>'
      +   '<div class="panel"><div class="panel-head"><h3>Low stock</h3></div><div class="panel-body">'
      +     lowStockList()
      +   '</div></div>'
      + '</div>';
    lastOrderId = newest ? newest.id : lastOrderId;
    document.getElementById("simBtn").addEventListener("click", simulateOrder);
    wireStatusSelects();
  }
  function kpiCard(bg,fg,path,val,lbl){
    return '<div class="kpi"><div class="k-ic" style="background:'+bg+'"><svg class="icon" viewBox="0 0 24 24" style="stroke:'+fg+'">'+path+'</svg></div><div class="val">'+val+'</div><div class="lbl">'+lbl+'</div></div>';
  }
  function lowStockList(){
    var low = state.products.filter(function(p){ return p.stock<=3; }).sort(function(a,b){return a.stock-b.stock;});
    if(!low.length) return '<p style="color:var(--ink-3);font-size:.9rem">All products are well stocked. 🎉</p>';
    return low.map(function(p){
      return '<div style="display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)">'+prodDot(p)+'<div style="flex:1"><div style="font-weight:600;font-size:.9rem">'+p.name+'</div><div style="font-size:.8rem;color:var(--ink-3)">'+fmt(p.price)+'</div></div>'+stockPill(p.stock)+'</div>';
    }).join("");
  }
  function orderCard(o, flash){
    return '<div class="order-card'+(flash?" flash":"")+'">'
      + '<div class="oc-top"><span class="badge-src src-'+o.source.replace(/\s/g,"-")+'">'+o.source+'</span><span class="oid">'+o.id+'</span><span class="otime">'+timeStr(o.ts)+'</span></div>'
      + '<div class="oc-cust">'+o.customer+' · '+o.phone+'</div>'
      + '<div class="oc-items">'+itemsLabel(o)+'</div>'
      + '<div class="oc-bottom"><span class="ototal">'+fmt(o.total)+'</span><span class="opay">'+o.payment+'</span>'
      +   '<select class="ostatus" data-id="'+o.id+'">'+["New","Packing","Out for delivery","Delivered"].map(function(s){return '<option'+(s===o.status?" selected":"")+'>'+s+'</option>';}).join("")+'</select></div>'
      + (o.staff && o.staff!=="—" ? '<div class="ostaff">Sold by '+o.staff+'</div>' : '')
      + '</div>';
  }
  function wireStatusSelects(){
    document.querySelectorAll(".ostatus").forEach(function(sel){
      sel.addEventListener("change", function(){
        var o = state.orders.filter(function(x){return x.id===sel.dataset.id;})[0];
        if(o){ o.status = sel.value; commit(); }
      });
    });
  }

  /* ----- INVENTORY ----- */
  function renderInventory(){
    document.getElementById("view").innerHTML =
      '<div class="view-head"><h2>Inventory &amp; pricing</h2><p>Edit stock levels and prices — changes apply instantly across the portal.</p></div>'
      + '<div class="panel"><div class="table-wrap"><table><thead><tr><th>Product</th><th>Price (KES)</th><th>Stock</th><th>Status</th><th></th></tr></thead><tbody id="invBody">'
      + state.products.map(function(p){
          return '<tr data-id="'+p.id+'"><td><div class="prod-cell">'+prodDot(p)+'<div>'+p.name+'<div style="font-size:.76rem;color:var(--ink-3);font-weight:400">'+p.brand+'</div></div></div></td>'
            + '<td><input class="inp price" type="number" min="0" step="1000" value="'+p.price+'"></td>'
            + '<td><input class="inp sm stock" type="number" min="0" step="1" value="'+p.stock+'"></td>'
            + '<td class="statusCell">'+stockPill(p.stock)+'</td>'
            + '<td><button class="btn btn-primary save">Save</button></td></tr>';
        }).join("")
      + '</tbody></table></div></div>';
    document.querySelectorAll("#invBody tr").forEach(function(tr){
      var id = tr.dataset.id, p = state.products.filter(function(x){return x.id===id;})[0];
      tr.querySelector(".save").addEventListener("click", function(){
        var price = Math.max(0, parseInt(tr.querySelector(".price").value,10)||0);
        var stock = Math.max(0, parseInt(tr.querySelector(".stock").value,10)||0);
        p.price = price; p.stock = stock; commit();
        tr.querySelector(".statusCell").innerHTML = stockPill(stock);
        tr.classList.remove("row-saved"); void tr.offsetWidth; tr.classList.add("row-saved");
        toast("Updated "+p.name);
      });
    });
  }

  /* ----- ORDERS ----- */
  function renderOrders(){
    document.getElementById("view").innerHTML =
      '<div class="view-head"><h2>Orders</h2><p>Every order from the site, WhatsApp and in-store sales.</p></div>'
      + '<div class="panel"><div class="panel-head"><h3>All orders <span style="color:var(--ink-3);font-weight:400">('+state.orders.length+')</span></h3>'
      +   '<select class="ostatus" id="srcFilter"><option value="all">All sources</option><option>Site</option><option>WhatsApp</option><option>In-store</option></select></div>'
      + '<div class="table-wrap"><table><thead><tr><th>Order</th><th>Source</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th></tr></thead><tbody id="ordBody"></tbody></table></div></div>';
    function draw(f){
      document.getElementById("ordBody").innerHTML = state.orders.filter(function(o){return f==="all"||o.source===f;}).map(function(o){
        return '<tr><td><b>'+o.id+'</b><div style="font-size:.76rem;color:var(--ink-3)">'+timeStr(o.ts)+'</div></td>'
          + '<td><span class="badge-src src-'+o.source.replace(/\s/g,"-")+'">'+o.source+'</span></td>'
          + '<td>'+o.customer+'<div style="font-size:.76rem;color:var(--ink-3)">'+o.phone+'</div></td>'
          + '<td style="color:var(--ink-2)">'+itemsLabel(o)+'</td><td><b>'+fmt(o.total)+'</b></td><td>'+o.payment+'</td>'
          + '<td><span class="pill '+(o.status==="Delivered"?"ok":(o.status==="New"?"low":""))+'" style="'+(o.status!=="Delivered"&&o.status!=="New"?"background:var(--bg);color:var(--ink-2)":"")+'">'+o.status+'</span></td></tr>';
      }).join("") || '<tr><td colspan="7" style="color:var(--ink-3);padding:22px 12px">No orders for this source.</td></tr>';
    }
    draw("all");
    document.getElementById("srcFilter").addEventListener("change", function(){ draw(this.value); });
  }

  /* ----- STAFF POS ----- */
  var draft = [];
  function renderSale(){
    document.getElementById("view").innerHTML =
      '<div class="view-head"><h2>New sale</h2><p>Record an in-store or WhatsApp sale — it appears in the admin dashboard instantly.</p></div>'
      + '<div class="pos-grid">'
      +   '<div class="panel"><div class="panel-head"><h3>Add items</h3></div><div class="panel-body">'
      +     '<div class="form-row"><label>Product</label><select id="posProduct">'+state.products.map(function(p,i){return '<option value="'+p.id+'"'+(p.stock<=0?" disabled":"")+'>'+p.name+' — '+fmt(p.price)+(p.stock<=0?" (out of stock)":" · "+p.stock+" in stock")+'</option>';}).join("")+'</select></div>'
      +     '<div class="two"><div class="form-row"><label>Quantity</label><input id="posQty" type="number" min="1" value="1"></div><div class="form-row" style="display:flex;align-items:flex-end"><button class="btn btn-soft btn-block" id="posAdd"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Add item</button></div></div>'
      +     '<div style="font-size:.8rem;font-weight:600;color:var(--ink-2);margin:10px 0 8px">Current sale</div>'
      +     '<div class="draft" id="draftList"></div>'
      +   '</div></div>'
      +   '<div class="panel"><div class="panel-head"><h3>Checkout</h3></div><div class="panel-body">'
      +     '<div class="form-row"><label>Customer name</label><input id="posName" placeholder="e.g. Wanjiru M."></div>'
      +     '<div class="form-row"><label>Phone</label><input id="posPhone" placeholder="07xx xxx xxx"></div>'
      +     '<div class="two"><div class="form-row"><label>Payment</label><select id="posPay"><option>M-Pesa</option><option>Cash</option><option>Card</option><option>Airtel Money</option></select></div>'
      +       '<div class="form-row"><label>Source</label><select id="posSrc"><option>In-store</option><option>WhatsApp</option></select></div></div>'
      +     '<div class="sale-total"><span>Total</span><span id="posTotal">KES 0</span></div>'
      +     '<button class="btn btn-primary btn-block" id="posComplete">Complete sale</button>'
      +   '</div></div>'
      + '</div>';
    document.getElementById("posAdd").addEventListener("click", posAdd);
    document.getElementById("posComplete").addEventListener("click", posComplete);
    drawDraft();
  }
  function drawDraft(){
    var el = document.getElementById("draftList"); if(!el) return;
    if(!draft.length){ el.innerHTML = '<div class="draft-empty">No items yet — add a product above.</div>'; }
    else {
      el.innerHTML = draft.map(function(d,i){
        return '<div class="draft-item"><span class="di-name">'+d.name+'</span><span class="di-qty">'+d.qty+' × '+fmt(d.price)+'</span><span class="di-amt">'+fmt(d.qty*d.price)+'</span><button class="di-rm" data-i="'+i+'" aria-label="Remove"><svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>';
      }).join("");
      el.querySelectorAll(".di-rm").forEach(function(b){ b.addEventListener("click", function(){ draft.splice(+b.dataset.i,1); drawDraft(); }); });
    }
    var total = draft.reduce(function(s,d){return s+d.qty*d.price;},0);
    var t = document.getElementById("posTotal"); if(t) t.textContent = fmt(total);
  }
  function posAdd(){
    var id = document.getElementById("posProduct").value, qty = Math.max(1, parseInt(document.getElementById("posQty").value,10)||1);
    var p = state.products.filter(function(x){return x.id===id;})[0]; if(!p) return;
    var existing = draft.filter(function(d){return d.id===id;})[0];
    var already = existing ? existing.qty : 0;
    if(already+qty > p.stock){ toast("Only "+p.stock+" in stock for "+p.name, true); return; }
    if(existing){ existing.qty += qty; } else { draft.push({id:p.id, name:p.name, price:p.price, qty:qty}); }
    document.getElementById("posQty").value = 1;
    drawDraft();
  }
  function posComplete(){
    if(!draft.length){ toast("Add at least one item first", true); return; }
    var name = document.getElementById("posName").value.trim() || "Walk-in customer";
    var phone = document.getElementById("posPhone").value.trim() || "—";
    var order = {
      id: "HD-" + (state.seq++),
      ts: Date.now(),
      items: draft.map(function(d){ return {name:d.name, qty:d.qty, price:d.price}; }),
      total: draft.reduce(function(s,d){return s+d.qty*d.price;},0),
      customer: name, phone: phone,
      payment: document.getElementById("posPay").value,
      source: document.getElementById("posSrc").value,
      staff: me.name, status: "New"
    };
    // decrement stock
    draft.forEach(function(d){ var p = state.products.filter(function(x){return x.id===d.id;})[0]; if(p) p.stock = Math.max(0, p.stock - d.qty); });
    state.orders.unshift(order);
    commit();
    draft = [];
    renderSale();
    toast("Sale "+order.id+" completed — sent to admin");
  }

  function renderMySales(){
    var mine = state.orders.filter(function(o){ return o.staff===me.name; });
    var total = mine.reduce(function(s,o){return s+o.total;},0);
    document.getElementById("view").innerHTML =
      '<div class="view-head"><h2>My sales</h2><p>Sales you have recorded on this device.</p></div>'
      + '<div class="kpis" style="grid-template-columns:repeat(2,1fr);max-width:520px">'
      +   kpiCard("rgba(0,168,98,.14)","var(--green)",'<path d="M3 3v18h18"/><path d="M7 14l3-3 3 3 5-6"/>', fmt(total), "Total sold by me")
      +   kpiCard("rgba(0,113,227,.12)","var(--accent)",'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8"/>', mine.length, "Sales made")
      + '</div>'
      + '<div class="panel"><div class="panel-head"><h3>Recent sales</h3></div><div class="table-wrap"><table><thead><tr><th>Order</th><th>Items</th><th>Total</th><th>Source</th><th>Status</th></tr></thead><tbody>'
      + (mine.length ? mine.map(function(o){
          return '<tr><td><b>'+o.id+'</b><div style="font-size:.76rem;color:var(--ink-3)">'+timeStr(o.ts)+'</div></td><td style="color:var(--ink-2)">'+itemsLabel(o)+'</td><td><b>'+fmt(o.total)+'</b></td><td><span class="badge-src src-'+o.source.replace(/\s/g,"-")+'">'+o.source+'</span></td><td>'+o.status+'</td></tr>';
        }).join("") : '<tr><td colspan="5" style="color:var(--ink-3);padding:22px 12px">No sales yet — record one from “New Sale”.</td></tr>')
      + '</tbody></table></div></div>';
  }

  /* ----- SIMULATE inbound site/WhatsApp order (admin demo) ----- */
  function simulateOrder(){
    var names = ["Kevin O.","Aisha N.","Peter G.","Faith W.","Dennis M.","Grace A."];
    var p = state.products[Math.floor(Math.random()*state.products.length)];
    var src = Math.random()>.5 ? "Site" : "WhatsApp";
    var order = {
      id:"HD-"+(state.seq++), ts:Date.now(),
      items:[{name:p.name, qty:1, price:p.price}], total:p.price,
      customer:names[Math.floor(Math.random()*names.length)],
      phone:"07"+Math.floor(10000000+Math.random()*89999999),
      payment:"M-Pesa", source:src, staff:"—", status:"New"
    };
    if(p.stock>0) p.stock--;
    state.orders.unshift(order);
    commit();
    rerender(true);
    toast("New "+src+" order "+order.id+" received");
  }

  /* ----- TOAST ----- */
  var toastEl = document.getElementById("toast"), toastTimer = null;
  function toast(msg){
    document.getElementById("toastMsg").textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2600);
  }

  /* ============ BOOT ============ */
  if(me) enterApp();
})();
</script>
</body>
</html>
